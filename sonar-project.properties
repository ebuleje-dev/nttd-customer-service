# ============================================
# SonarQube Configuration for Customer Service
# ============================================

# Project identification
sonar.projectKey=nttd-customer-service
sonar.projectName=NTT Data - Customer Service
sonar.projectVersion=0.0.1-SNAPSHOT

# SonarQube server
sonar.host.url=http://localhost:8081

# Source code encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=17
sonar.java.target=17

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Binaries (compiled classes)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Libraries
sonar.java.libraries=target/*.jar

# Code coverage report (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions (files to ignore in analysis)
sonar.exclusions=\
  **/target/generated-sources/**,\
  **/com/nttd/banking/customer/api/**,\
  **/com/nttd/banking/customer/model/dto/**,\
  **/config/**,\
  **/*Application.java,\
  **/infrastructure/adapter/out/messaging/**,\
  **/infrastructure/adapter/out/persistence/**,\
  **/infrastructure/adapter/out/cache/**,\
  **/infrastructure/adapter/in/rest/**,\
  **/domain/event/**

# Test exclusions
sonar.test.exclusions=\
  **/*Test.java,\
  **/*Tests.java

# Duplication exclusions
sonar.cpd.exclusions=\
  **/test/**

# SCM (Source Control Management)
sonar.scm.provider=git
